<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hospodská kalkulačka</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --surface: #fff8f4;
      --surface-low: #fff1e5;
      --surface-container: #faebde;
      --surface-high: #f4e6d8;
      --surface-highest: #efe0d3;
      --text: #211a12;
      --muted: #524435;
      --outline: #857462;
      --outline-soft: #d8c3ae;
      --primary: #855300;
      --primary-hot: #d48806;
      --primary-soft: #ffddb8;
      --primary-soft-2: #ffb95f;
      --danger: #ba1a1a;
      --danger-soft: #ffdad6;
      --wood: #372f26;
      --slate: #595f66;
      --disabled: #9a9995;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --header-h: 76px;
      --sidebar-w: 270px;
      --ledge: 4px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 25% 20%, rgba(255, 185, 95, .62), transparent 34%),
        radial-gradient(circle at 78% 58%, rgba(255, 185, 95, .54), transparent 31%),
        linear-gradient(90deg, rgba(55, 47, 38, .92) 0 21%, rgba(133, 83, 0, .45) 21% 42%, rgba(255, 185, 95, .7) 42% 69%, rgba(55, 47, 38, .9) 69% 100%);
      font-family: "Literata", Georgia, serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px clamp(16px, 3vw, 30px);
      background: rgba(255, 248, 244, .96);
      border-bottom: 2px solid var(--outline);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon,
    .item-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--primary);
      flex: 0 0 auto;
    }

    .brand h1 {
      margin: 0;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(21px, 2.3vw, 30px);
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-total {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--primary);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 5vw, 56px);
      line-height: .95;
      white-space: nowrap;
    }

    .icon-button {
      display: grid;
      place-items: center;
      min-width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      transition: transform .15s ease, background .15s ease;
    }

    .icon-button:hover {
      background: var(--surface-high);
    }

    .icon-button:active {
      transform: translateY(2px);
    }

    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      min-height: calc(100vh - var(--header-h));
    }

    .sidebar {
      position: sticky;
      top: var(--header-h);
      align-self: start;
      height: calc(100vh - var(--header-h));
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 22px 18px;
      background: rgba(255, 241, 229, .96);
      border-right: 2px solid var(--outline);
    }

    .sidebar-title {
      margin: 0 0 6px;
      color: var(--primary);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 28px;
      line-height: 1.05;
    }

    .sidebar p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .nav {
      display: grid;
      gap: 9px;
      margin-top: 18px;
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      color: var(--muted);
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      transition: background .15s ease, transform .15s ease;
    }

    .nav a.active {
      color: #472a00;
      background: var(--primary-hot);
    }

    .nav a:hover {
      background: var(--surface-highest);
    }

    .sidebar-actions {
      margin-top: auto;
      display: grid;
      gap: 12px;
    }

    main {
      width: min(1120px, 100%);
      margin-inline: auto;
      padding: clamp(16px, 3vw, 32px);
      padding-bottom: 120px;
    }

    .receipt {
      position: relative;
      overflow: hidden;
      padding: clamp(22px, 3vw, 32px);
      background: var(--surface-highest);
      border: 2px solid var(--outline);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      clip-path: polygon(
        0 0, 100% 0, 100% 92%,
        98% 100%, 96% 92%, 94% 100%, 92% 92%, 90% 100%,
        88% 92%, 86% 100%, 84% 92%, 82% 100%, 80% 92%,
        78% 100%, 76% 92%, 74% 100%, 72% 92%, 70% 100%,
        68% 92%, 66% 100%, 64% 92%, 62% 100%, 60% 92%,
        58% 100%, 56% 92%, 54% 100%, 52% 92%, 50% 100%,
        48% 92%, 46% 100%, 44% 92%, 42% 100%, 40% 92%,
        38% 100%, 36% 92%, 34% 100%, 32% 92%, 30% 100%,
        28% 92%, 26% 100%, 24% 92%, 22% 100%, 20% 92%,
        18% 100%, 16% 92%, 14% 100%, 12% 92%, 10% 100%,
        8% 92%, 6% 100%, 4% 92%, 2% 100%, 0 92%
      );
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      gap: 24px;
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      color: var(--muted);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1;
      text-transform: uppercase;
    }

    .receipt-total {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(44px, 8vw, 70px);
      font-weight: 700;
      letter-spacing: -.04em;
      line-height: 1;
    }

    .receipt-total small {
      color: var(--muted);
      font-size: .42em;
      letter-spacing: 0;
    }

    .table-no {
      text-align: right;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 700;
    }

    .section {
      margin-top: clamp(24px, 4vw, 42px);
    }

    .grid-actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .quick-btn,
    .raised-btn {
      border: 2px solid var(--outline);
      border-radius: var(--radius-md);
      box-shadow: 0 var(--ledge) 0 0 var(--outline);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    .quick-btn:active,
    .raised-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 0 var(--outline);
    }

    .quick-btn {
      min-height: 145px;
      display: grid;
      place-items: center;
      gap: 8px;
      padding: 22px 16px;
      color: var(--text);
      background: rgba(255, 248, 244, .94);
      text-align: center;
    }

    .quick-btn:hover {
      background: var(--surface-low);
    }

    .quick-name {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(18px, 2vw, 22px);
      font-weight: 500;
    }

    .quick-price {
      color: var(--primary);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 28px;
      align-items: start;
    }

    .card {
      background: rgba(255, 248, 244, .96);
      border: 2px solid var(--outline);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .history-list {
      display: grid;
    }

    .history-empty {
      padding: 26px;
      color: var(--muted);
      text-align: center;
    }

    .history-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--outline-soft);
      animation: itemIn .22s ease both;
    }

    .history-item:last-child {
      border-bottom: 0;
    }

    @keyframes itemIn {
      from {
        transform: translateY(-5px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .history-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .history-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--primary);
      background: var(--surface-high);
      border-radius: 999px;
    }

    .history-title {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 19px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-time {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .history-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 22px;
      font-weight: 500;
      white-space: nowrap;
    }

    .delete-btn {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 0;
      color: var(--danger);
      background: transparent;
      border-radius: 999px;
    }

    .delete-btn:hover {
      background: var(--danger-soft);
    }

    .panel {
      display: grid;
      gap: 14px;
    }

    .raised-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 58px;
      padding: 14px 18px;
      color: var(--text);
      background: var(--surface-high);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 17px;
      font-weight: 700;
    }

    .raised-btn.primary {
      color: #472a00;
      background: var(--primary-hot);
    }

    .raised-btn.danger {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .raised-btn.muted {
      color: #31312e;
      background: var(--disabled);
    }

    .quote {
      margin-top: 14px;
      padding: 22px;
      background: rgba(255, 241, 229, .96);
      border: 2px dashed var(--outline);
      border-radius: var(--radius-md);
    }

    .quote-head {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      color: var(--primary);
      background: var(--surface-highest);
      border: 2px solid var(--outline);
      border-radius: 12px;
    }

    .quote p {
      margin: 0;
    }

    .quote small {
      color: var(--muted);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
    }

    .quote-text {
      color: var(--muted);
      font-style: italic;
    }

    .mobile-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 35;
      display: none;
      width: 100%;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px 12px 14px;
      background: rgba(255, 248, 244, .97);
      border-top: 2px solid var(--outline);
      backdrop-filter: blur(10px);
    }

    .mobile-nav a {
      display: grid;
      place-items: center;
      gap: 2px;
      padding: 9px;
      color: var(--muted);
      text-decoration: none;
      border-radius: 999px;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .mobile-nav a.active {
      color: #472a00;
      background: var(--primary-soft);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(33, 26, 18, .48);
    }

    .modal.open {
      display: grid;
    }

    .modal-box {
      width: min(760px, 100%);
      max-height: min(760px, 92vh);
      overflow: auto;
      background: var(--surface);
      border: 2px solid var(--outline);
      border-radius: var(--radius-lg);
    }

    .modal-head,
    .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 20px;
      background: var(--surface-low);
    }

    .modal-head {
      border-bottom: 1px solid var(--outline-soft);
    }

    .modal-foot {
      border-top: 1px solid var(--outline-soft);
    }

    .modal-title {
      margin: 0;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 24px;
    }

    .settings-list {
      display: grid;
      gap: 12px;
      padding: 18px 20px;
    }

    .setting-row {
      display: grid;
      grid-template-columns: 1.2fr .7fr .9fr auto;
      gap: 10px;
      align-items: end;
      padding: 14px;
      background: var(--surface-container);
      border: 1px solid var(--outline-soft);
      border-radius: var(--radius-md);
    }

    .field {
      display: grid;
      gap: 5px;
    }

    .field label {
      color: var(--muted);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      color: var(--text);
      background: var(--surface);
      border: 2px solid var(--outline);
      border-radius: var(--radius-sm);
    }

    .tiny-btn {
      min-height: 42px;
      padding: 8px 12px;
      border: 2px solid var(--outline);
      border-radius: var(--radius-sm);
      color: var(--text);
      background: var(--surface-high);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 700;
    }

    .tiny-btn.danger {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      white-space: nowrap;
      border: 0;
      clip: rect(0, 0, 0, 0);
    }

    svg {
      width: 1em;
      height: 1em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .svg-lg {
      font-size: 40px;
    }

    .svg-md {
      font-size: 24px;
    }

    @media (max-width: 980px) {
      .shell {
        display: block;
      }

      .sidebar {
        display: none;
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

      .panel {
        grid-template-columns: 1fr 1fr;
      }

      .quote {
        grid-column: 1 / -1;
      }

      main {
        padding-inline: 16px;
      }
    }

    @media (max-width: 700px) {
      :root {
        --header-h: 66px;
      }

      .app-header {
        padding: 10px 14px;
      }

      .brand h1 {
        max-width: 48vw;
      }

      .top-total {
        font-size: 29px;
      }

      .receipt-row {
        align-items: flex-start;
      }

      .grid-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .quick-btn {
        min-height: 124px;
        padding: 18px 10px;
      }

      .panel {
        grid-template-columns: 1fr;
      }

      .history-item {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .history-right {
        justify-content: space-between;
      }

      .mobile-nav {
        display: grid;
      }

      .setting-row {
        grid-template-columns: 1fr;
      }

      .modal-foot {
        flex-direction: column;
      }

      .modal-foot .raised-btn,
      .modal-foot .tiny-btn {
        width: 100%;
      }
    }

    @media (max-width: 420px) {
      .brand-icon {
        display: none;
      }

      .receipt {
        padding: 20px 16px 28px;
      }

      .receipt-total {
        font-size: 42px;
      }

      .table-no {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="brand" aria-label="Hospodská kalkulačka">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 8h7v12H8z"/><path d="M15 10h2a3 3 0 0 1 0 6h-2"/><path d="M8 8a4 4 0 0 1 8 0"/><path d="M7 20h10"/></svg>
      </span>
      <h1>Hospodská kalkulačka</h1>
    </div>

    <div class="top-total">
      <span id="topTotal">0 Kč</span>
      <button class="icon-button" id="scrollHistoryBtn" title="Historie" aria-label="Přejít na historii">
        <svg class="svg-md" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/><path d="M12 7v5l3 2"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" aria-label="Postranní navigace">
      <div>
        <h2 class="sidebar-title">Hospodská<br>kalkulačka</h2>
        <p>Vítejte u stolu</p>
      </div>

      <nav class="nav">
        <a class="active" href="#kalkulacka">
          <svg class="svg-md" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8"/><path d="M8 11h2M14 11h2M8 15h2M14 15h2"/></svg>
          Kalkulačka
        </a>
        <a href="#historie">
          <svg class="svg-md" viewBox="0 0 24 24"><path d="M7 3h10v18H7z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
          Historie
        </a>
        <a href="#nastaveni">
          <svg class="svg-md" viewBox="0 0 24 24"><path d="M4 8h16v8H4z"/><path d="M7 12h2M15 12h2"/></svg>
          Ceník
        </a>
        <a href="#nastaveni">
          <svg class="svg-md" viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/><circle cx="12" cy="12" r="4"/></svg>
          Nastavení
        </a>
      </nav>

      <div class="sidebar-actions">
        <button class="raised-btn primary" id="newBillBtn">
          <svg class="svg-md" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Nový účet
        </button>
      </div>
    </aside>

    <main id="kalkulacka">
      <section class="receipt" aria-label="Souhrn účtu">
        <div class="receipt-row">
          <div>
            <p class="label">Celková útrata</p>
            <h2 class="receipt-total"><span id="receiptTotal">0</span><small>Kč</small></h2>
          </div>
          <div>
            <p class="label">Stůl č.</p>
            <div class="table-no" id="tableNumber">12</div>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="quickAddTitle">
        <h3 class="label" id="quickAddTitle">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          Přidat položku
        </h3>

        <div class="grid-actions" id="quickButtons"></div>
      </section>

      <section class="section content-grid">
        <div id="historie">
          <h3 class="label">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
            Poslední položky
          </h3>

          <div class="card">
            <div class="history-list" id="historyList"></div>
          </div>
        </div>

        <aside id="nastaveni" class="panel" aria-label="Nastavení kalkulačky">
          <h3 class="label" style="grid-column: 1 / -1;">
            <svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M2 14h4M10 8h4M18 16h4"/></svg>
            Nastavení
          </h3>

          <button class="raised-btn muted" id="openSettingsBtn">
            <svg class="svg-md" viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/><circle cx="12" cy="12" r="4"/></svg>
            Nastavení cen
          </button>

          <button class="raised-btn danger" id="clearBtn">
            <svg class="svg-md" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 11v6M14 11v6"/></svg>
            Smazat vše
          </button>

          <div class="quote">
            <div class="quote-head">
              <div class="avatar" aria-hidden="true">
                <svg class="svg-md" viewBox="0 0 24 24"><path d="M8 8h7v12H8z"/><path d="M15 10h2a3 3 0 0 1 0 6h-2"/><path d="M8 8a4 4 0 0 1 8 0"/></svg>
              </div>
              <div>
                <small>Stamgast</small>
                <p>Host č. <span id="quoteTable">12</span></p>
              </div>
            </div>
            <p class="quote-text">„Pivo dělá hezká těla.“</p>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Mobilní navigace">
    <a class="active" href="#kalkulacka">
      <svg class="svg-md" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Přidat
    </a>
    <a href="#historie">
      <svg class="svg-md" viewBox="0 0 24 24"><path d="M7 3h10v18H7z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
      Historie
    </a>
    <a href="#nastaveni">
      <svg class="svg-md" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M2 14h4M10 8h4M18 16h4"/></svg>
      Nastavení
    </a>
  </nav>

  <div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-box">
      <div class="modal-head">
        <h2 class="modal-title" id="settingsTitle">Nastavení tlačítek</h2>
        <button class="icon-button" id="closeSettingsBtn" aria-label="Zavřít nastavení">
          <svg class="svg-md" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="settings-list" id="settingsList"></div>

      <div class="modal-foot">
        <button class="tiny-btn" id="addButtonBtn">+ Přidat tlačítko</button>
        <button class="raised-btn primary" id="saveSettingsBtn" style="max-width: 240px;">Uložit nastavení</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "hospodska-kalkulacka-v1";

    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
    }

    function cloneData(data) {
      if (typeof structuredClone === "function") {
        return structuredClone(data);
      }

      return JSON.parse(JSON.stringify(data));
    }

    const icons = {
      beer: '<svg class="svg-lg" viewBox="0 0 24 24"><path d="M8 8h7v12H8z"/><path d="M15 10h2a3 3 0 0 1 0 6h-2"/><path d="M8 8a4 4 0 0 1 8 0"/><path d="M7 20h10"/></svg>',
      drink: '<svg class="svg-lg" viewBox="0 0 24 24"><path d="M7 3h10l-1 18H8z"/><path d="M8 8h8"/><path d="M10 13h4"/></svg>',
      shot: '<svg class="svg-lg" viewBox="0 0 24 24"><path d="M6 4h5l-.8 14H6.8z"/><path d="M14 8h4v12h-4z"/><path d="M13 8h6l-1-4h-4z"/></svg>',
      food: '<svg class="svg-lg" viewBox="0 0 24 24"><path d="M7 3v18"/><path d="M4 3v5a3 3 0 0 0 6 0V3"/><path d="M17 3v18"/><path d="M17 3c2 2 3 4 3 7h-3"/></svg>',
      coffee: '<svg class="svg-lg" viewBox="0 0 24 24"><path d="M5 8h11v6a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5z"/><path d="M16 10h2a3 3 0 0 1 0 6h-2"/><path d="M6 3v2M10 3v2M14 3v2"/></svg>',
      custom: '<svg class="svg-lg" viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6"/></svg>'
    };

    const defaultState = {
      table: 12,
      items: [
        { id: createId(), name: "Pivo", price: 50, icon: "beer" },
        { id: createId(), name: "Kofola", price: 35, icon: "drink" },
        { id: createId(), name: "Panák", price: 60, icon: "shot" },
        { id: createId(), name: "Jídlo", price: 150, icon: "food" }
      ],
      history: []
    };

    let state = loadState();

    const quickButtons = document.getElementById("quickButtons");
    const historyList = document.getElementById("historyList");
    const topTotal = document.getElementById("topTotal");
    const receiptTotal = document.getElementById("receiptTotal");
    const tableNumber = document.getElementById("tableNumber");
    const quoteTable = document.getElementById("quoteTable");
    const settingsModal = document.getElementById("settingsModal");
    const settingsList = document.getElementById("settingsList");

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || !Array.isArray(saved.items) || !Array.isArray(saved.history)) {
          return cloneData(defaultState);
        }
        return saved;
      } catch {
        return cloneData(defaultState);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function formatPrice(value) {
      return `${Number(value || 0).toLocaleString("cs-CZ")} Kč`;
    }

    function formatTime(iso) {
      const date = new Date(iso);
      return `Dnes, ${date.toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" })}`;
    }

    function getTotal() {
      return state.history.reduce((sum, item) => sum + Number(item.price || 0), 0);
    }

    function render() {
      const total = getTotal();

      topTotal.textContent = formatPrice(total);
      receiptTotal.textContent = Number(total).toLocaleString("cs-CZ");
      tableNumber.textContent = state.table;
      quoteTable.textContent = state.table;

      quickButtons.innerHTML = state.items.map(item => `
        <button class="quick-btn" data-add-id="${item.id}" title="Přidat ${escapeHtml(item.name)}">
          <span class="item-icon">${icons[item.icon] || icons.custom}</span>
          <span class="quick-name">${escapeHtml(item.name)}</span>
          <span class="quick-price">${formatPrice(item.price)}</span>
        </button>
      `).join("");

      if (!state.history.length) {
        historyList.innerHTML = `<div class="history-empty">Zatím tu nic není. Klikni na položku a účet se začne počítat.</div>`;
      } else {
        historyList.innerHTML = state.history.map(entry => `
          <article class="history-item">
            <div class="history-left">
              <div class="history-icon">${icons[entry.icon] || icons.custom}</div>
              <div style="min-width:0;">
                <h4 class="history-title">${escapeHtml(entry.name)}</h4>
                <p class="history-time">${formatTime(entry.createdAt)}</p>
              </div>
            </div>
            <div class="history-right">
              <span>${formatPrice(entry.price)}</span>
              <button class="delete-btn" data-delete-id="${entry.id}" aria-label="Smazat položku ${escapeHtml(entry.name)}">
                <svg class="svg-md" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/><path d="M10 11v6M14 11v6"/></svg>
              </button>
            </div>
          </article>
        `).join("");
      }

      saveState();
    }

    function addHistoryItem(item) {
      state.history.unshift({
        id: createId(),
        itemId: item.id,
        name: item.name,
        price: Number(item.price),
        icon: item.icon,
        createdAt: new Date().toISOString()
      });
      render();
    }

    function deleteHistoryItem(id) {
      state.history = state.history.filter(item => item.id !== id);
      render();
    }

    function openSettings() {
      renderSettingsRows();
      settingsModal.classList.add("open");
    }

    function closeSettings() {
      settingsModal.classList.remove("open");
    }

    function renderSettingsRows() {
      settingsList.innerHTML = state.items.map(item => settingRowTemplate(item)).join("");
    }

    function settingRowTemplate(item) {
      return `
        <div class="setting-row" data-setting-id="${item.id}">
          <div class="field">
            <label>Název</label>
            <input type="text" value="${escapeAttribute(item.name)}" data-field="name" placeholder="Např. Pivo">
          </div>
          <div class="field">
            <label>Cena Kč</label>
            <input type="number" value="${Number(item.price)}" min="0" step="1" data-field="price" placeholder="50">
          </div>
          <div class="field">
            <label>Ikona</label>
            <select data-field="icon">
              <option value="beer" ${item.icon === "beer" ? "selected" : ""}>Pivo</option>
              <option value="drink" ${item.icon === "drink" ? "selected" : ""}>Nápoj</option>
              <option value="shot" ${item.icon === "shot" ? "selected" : ""}>Panák</option>
              <option value="food" ${item.icon === "food" ? "selected" : ""}>Jídlo</option>
              <option value="coffee" ${item.icon === "coffee" ? "selected" : ""}>Káva</option>
              <option value="custom" ${item.icon === "custom" ? "selected" : ""}>Vlastní</option>
            </select>
          </div>
          <button class="tiny-btn danger" data-remove-setting="${item.id}" type="button">Smazat</button>
        </div>
      `;
    }

    function saveSettingsFromModal() {
      const rows = [...settingsList.querySelectorAll(".setting-row")];

      const nextItems = rows.map(row => {
        const id = row.dataset.settingId;
        const name = row.querySelector('[data-field="name"]').value.trim() || "Položka";
        const price = Math.max(0, Number(row.querySelector('[data-field="price"]').value || 0));
        const icon = row.querySelector('[data-field="icon"]').value;

        return { id, name, price, icon };
      });

      state.items = nextItems;
      render();
      closeSettings();
    }

    function addSettingsRow() {
      const item = {
        id: createId(),
        name: "Nová položka",
        price: 0,
        icon: "custom"
      };
      settingsList.insertAdjacentHTML("beforeend", settingRowTemplate(item));
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(text) {
      return escapeHtml(text);
    }

    document.addEventListener("click", event => {
      const addBtn = event.target.closest("[data-add-id]");
      if (addBtn) {
        const item = state.items.find(item => item.id === addBtn.dataset.addId);
        if (item) addHistoryItem(item);
      }

      const deleteBtn = event.target.closest("[data-delete-id]");
      if (deleteBtn) {
        deleteHistoryItem(deleteBtn.dataset.deleteId);
      }

      const removeSettingBtn = event.target.closest("[data-remove-setting]");
      if (removeSettingBtn) {
        const row = removeSettingBtn.closest(".setting-row");
        if (row) row.remove();
      }
    });

    document.getElementById("openSettingsBtn").addEventListener("click", openSettings);
    document.getElementById("closeSettingsBtn").addEventListener("click", closeSettings);
    document.getElementById("saveSettingsBtn").addEventListener("click", saveSettingsFromModal);
    document.getElementById("addButtonBtn").addEventListener("click", addSettingsRow);

    document.getElementById("clearBtn").addEventListener("click", () => {
      if (state.history.length && confirm("Opravdu smazat všechny položky z aktuálního účtu?")) {
        state.history = [];
        render();
      }
    });

    document.getElementById("newBillBtn").addEventListener("click", () => {
      if (!state.history.length || confirm("Začít nový účet a smazat aktuální položky?")) {
        state.history = [];
        state.table = Number(prompt("Číslo stolu:", state.table) || state.table);
        render();
      }
    });

    document.getElementById("scrollHistoryBtn").addEventListener("click", () => {
      document.getElementById("historie").scrollIntoView({ behavior: "smooth", block: "start" });
    });

    settingsModal.addEventListener("click", event => {
      if (event.target === settingsModal) closeSettings();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeSettings();
    });

    render();
  </script>
</body>
</html>
